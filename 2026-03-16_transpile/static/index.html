<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
        href="style.css">
  <script type="module"
          src="script.ts"></script>
  <title>essen</title>
</head>

<body>
  <h1>Essensliste</h1>
  <button id="hole-essen">Hole Essen</button>
  <button id="loesche-essen">Lösche Essen</button>
  
  <hr>
  
  <h2>ms-Paket Demo</h2>
  <input type="text"
         id="ms-input"
         placeholder="Zeit eingeben (z.B. '2 days', '1h 30m')">
  <button id="ms-button">Zeit umrechnen</button>
  <p id="ms-output"></p>
  
  <hr>
  
  <h2>async/await Demo</h2>
  <button id="fetch-hallo">Fetch /hallo</button>
  <button id="fetch-essen">Fetch /essen</button>
  <p id="async-output"></p>
  
  <hr>
  
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Essen</th>
      </tr>
    </thead>
    <tbody id="tabelle"></tbody>
  </table>
</body>

</html>
