<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response-Objekt: .json() und .text()</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 8px; max-width: 600px; margin: 20px auto; text-align: left; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Response-Objekt: .json() vs .text()</h1>
    <button id="btn-json">.json() abrufen</button>
    <button id="btn-text">.text() abrufen</button>
    <pre id="output">Klicke einen Button</pre>

    <script>
        const output = document.getElementById("output");

        document.getElementById("btn-json").addEventListener("click", async () => {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/todos/1");
                output.textContent = "Status: " + res.status + "\n\n.json():\n" + JSON.stringify(await res.json(), null, 2);
            } catch (e) {
                output.textContent = "Fehler: " + e.message;
            }
        });

        document.getElementById("btn-text").addEventListener("click", async () => {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/todos/1");
                output.textContent = "Status: " + res.status + "\n\n.text():\n" + await res.text();
            } catch (e) {
                output.textContent = "Fehler: " + e.message;
            }
        });
    </script>
</body>
</html>
